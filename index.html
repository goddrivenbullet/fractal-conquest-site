<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fractal Conquest</title>
  <meta name="description" content="A turn-based war of islands, cities, and fog. A free iPhone game with no ads, by James Crout.">
  <style>
:root {
  --bg: #071018;
  --raised: #102033;
  --line: #234058;
  --text: #E7EEF6;
  --dim: #8BA3B8;
  --gold: #E2B15A;
  --ink: #071018;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
a { color: var(--gold); }
main, footer { width: min(40rem, calc(100% - 2.5rem)); margin-inline: auto; }
main { flex: 1; padding: 3.5rem 0 2.5rem; }
.kicker {
  margin: 0 0 0.4rem;
  color: var(--gold);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 0.72rem;
  font-weight: 700;
}
h1 { margin: 0 0 0.85rem; font-size: 2.4rem; line-height: 1.1; font-weight: 800; }
.lede { margin: 0 0 1.75rem; color: var(--dim); font-size: 1.15rem; line-height: 1.5; max-width: 34rem; }
nav { display: flex; gap: 1rem; flex-wrap: wrap; }
nav a { text-decoration: none; font-weight: 600; }
nav a:hover { text-decoration: underline; text-underline-offset: 0.2em; }
footer {
  border-top: 1px solid var(--line);
  padding: 1.25rem 0 2.5rem;
  color: var(--dim);
  font-size: 0.9rem;
}
  </style>
</head>
<body>
  <main>
    <p class="kicker">An iPhone game by James Crout</p>
    <h1>Fractal Conquest</h1>
    <p class="lede">A turn-based war of islands, cities, and fog. Free, with no ads.</p>
    <nav>
      <a href="privacy.html">Privacy Policy</a>
      <a href="support.html">Support</a>
    </nav>
  </main>
  <footer>
    <p>Questions: <a href="mailto:Croutbenefits@gmail.com">Croutbenefits@gmail.com</a></p>
  </footer>
</body>
</html>
